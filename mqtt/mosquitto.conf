# Private Meshtastic broker for Stalkie Talkie. No anonymous clients.
# Passwords and the ACL are generated by mqtt/deploy.sh and are not in git.

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/secrets/passwd
acl_file /mosquitto/config/secrets/acl

# Home LAN and localhost. Tailscale Funnel on 8443 forwards here after it
# terminates TLS. Do not publish 1883 on the router: Starlink CGNAT cannot
# accept inbound connections, and the password would travel in the clear
# on the public internet. On the home LAN the password is still required.
listener 1883
protocol mqtt

max_connections 64
max_packet_size 8192
